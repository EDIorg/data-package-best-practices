project:
  type: book
  output-dir: _book

book:
  chapters:
    - index.qmd
    - code.qmd
    - model-based.qmd
    - images-and-docs.qmd
    - spatial-data.qmd
    - moving-platforms.qmd
    - other-repositories.qmd
    - large-offline.qmd


execute:
  freeze: auto

bibliography: ../references.bib

format:
  pdf:
    toc: true
    number-sections: true
    colorlinks: true
    include-in-header: 
      text: |
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}
    # Currently has no effect (?) so renaming in Makefile
    output-file: "guide-special-cases_v1.1"
    output-ext: "pdf"
  docx:
    toc: true
    number-sections: true
    colorlinks: true
    # Currently has no effect (?) so renaming in Makefile
    output-file: "guide-special-cases_v1.1"
    output-ext:  "docx"



