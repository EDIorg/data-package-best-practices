project:
  type: website
  output-dir: _site
  pre-render: make allbooks
  post-render: make movebooks


website:
  title: "Environmental Dataset Preparation Guides"
  description: "Community-developed guides for preparing and publishing datasets in the environmental sciences, and similar contexts, using the Ecological Metadata Language (EML) and other standards."
  favicon: img/edi-logo.png
  site-url: https://ediorg.github.io/data-package-best-practices
  repo-url: https://github.com/EDIorg/data-package-best-practices
  issue-url: https://github.com/EDIorg/data-package-best-practices/issues/new/choose
  repo-branch: main
  repo-actions: [edit, issue]
  page-navigation: true
  bread-crumbs: true
  announcement: 
    content: "**Publication version**: See the [prerelease version](https://prerelease-edi-docs.netlify.app/) for documents under active community development." 
    position: above-navbar
    dismissable: false
    type: danger
  search:
    location: navbar
  navbar:
    logo: img/edi-logo.png
    background: light
    left:
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
      - text: More
        menu:
          - contributing.qmd
          - history.qmd
    tools:
      - icon: github
        href: https://github.com/ediorg/data-package-best-practices
        text: EDIorg GitHub repository

  sidebar:
    - id: alldocs
      style: floating
      title: "Guides"
      collapse-level: 1
      contents:
        - section: "EML Best Practices"
          href: guide-eml-bp/index.qmd
          contents:
            - href: guide-eml-bp/preface.qmd
            - href: guide-eml-bp/introduction.qmd
              text: "1. Introduction"
            - href: guide-eml-bp/content-recommendations.qmd
              text: "2. Content recommendations for Elements and Attributes"
        - section: "Dataset Design for Special Cases"
          href: guide-special-cases/index.qmd
          contents: 
            - href: guide-special-cases/code.qmd
              text: "1. Code"
            - href: guide-special-cases/model-based.qmd
              text: "2. Model-based datasets"
            - href: guide-special-cases/images-and-docs.qmd
              text: "3. Images and documents as data"
            - href: guide-special-cases/spatial-data.qmd
              text: "4. Spatial data"
            - href: guide-special-cases/moving-platforms.qmd
              text: "5. Data gathered with small moving platforms"
            - href: guide-special-cases/other-repositories.qmd
              text: "6. Data in other repositories"
            - href: guide-special-cases/large-offline.qmd
              text: "7. Large datasets"
        - section: "Domain-Specific Guides"
          href: guide-domain-specific/about-domain-specific.qmd
          contents:
            - guide-domain-specific/ecocom.qmd
            - guide-domain-specific/hymet.qmd
            - guide-domain-specific/soil-carbon.qmd
    - id: archivedocs
      style: floating
      title: "Archived Guides"
      collapse-level: 2
      contents:
        - section: "EML Best Practices v3 (Archived)"
          href: archive/emlbestpractices-v3.pdf

execute:
  freeze: auto

bibliography: references.bib

format:
  html:
    theme: cosmo
    highlight-style: pygments
    code-block-bg: true
    code-block-border-left: "#31BAE9"
    fontsize: 1.0em
    toc: true

