project:
  type: book
  output-dir: _book

book:
  title: "EDI Dataset Preparation Guides"
  author: "Environmental Data Initiative and colleagues"
  description: "Community-developed guides for preparing and publishing datasets in the environmental sciences, and similar contexts, using the Ecological Metadata Language (EML)."
  date: "2022-05-25"
  favicon: img/edi-logo.png
  site-url: https://ediorg.github.io/data-package-best-practices
  repo-url: https://github.com/ediorg/data-package-best-practices
  repo-branch: main
  repo-actions: [edit, issue]
  navbar:
    search: true
    logo: img/edi-logo.png
  chapters:
    - index.qmd
    - about.qmd
    - contributing.qmd

    - part: guide-eml-bp/index.qmd
      chapters:
        - file: guide-eml-bp/preface.qmd
        - text: 1 Introduction
          file: guide-eml-bp/introduction.qmd
        - text: 2 Content recommendations for Elements and Attributes
          file: guide-eml-bp/content-recommendations.qmd

    - part: guide-special-cases/index.qmd
      chapters: 
        - guide-special-cases/preface.qmd
        - text: 1 Code
          file: guide-special-cases/code.qmd
        - text: 2 Model-Based Datasets
          file: guide-special-cases/model-based.qmd
        - text: 3 Images and Documents as Data
          file: guide-special-cases/images-and-docs.qmd
        - text: 4 Spatial Data
          file: guide-special-cases/spatial-data.qmd
        - text: 5 Data Gathered with Small Moving Platforms
          file: guide-special-cases/moving-platforms.qmd
        - text: 6 Data in Other Repositories
          file: guide-special-cases/other-repositories.qmd
        - text: 7 Large Data Sets
          file: guide-special-cases/large-offline.qmd

    - part: guide-domain-specific/preface.qmd
      chapters:
        - guide-domain-specific/ecocom.qmd
        - guide-domain-specific/hymet.qmd
        - guide-domain-specific/soil-carbon.qmd
    - references.qmd

execute:
  freeze: auto

bibliography: references.bib

format:
  html:
    theme: cosmo
    number-sections: false   
#  pdf:
#    documentclass: scrreprt



