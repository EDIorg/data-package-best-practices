project:
  type: book
  output-dir: _book

book:
  chapters:
    - index.qmd
    - preface.qmd
    - introduction.qmd
    - content-recommendations.qmd

execute:
  freeze: auto

bibliography: ../../references.bib

format:
  pdf:
    toc: true
    number-sections: true
    colorlinks: true
    output-file: "guide-eml-bp_v3.1"
    output-ext:  "pdf"
  docx:
    toc: true
    number-sections: true
    colorlinks: true
    output-file: "guide-eml-bp_v3.1"
    output-ext:  "docx"